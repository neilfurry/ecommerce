packages:
  - 'apps/*'
  - 'packages/*'
  - 'prisma'

# Native/post-install builds that pnpm is allowed to run.
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma
  - msgpackr-extract

# Security fixes for transitive dependencies (pnpm audit --prod; see docs/production/SECURITY_GUIDE.md).
overrides:
  'effect@<3.22.1': '^3.22.5'
  'uuid@<11.1.1': '^11.1.1'
