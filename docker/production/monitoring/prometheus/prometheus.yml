# Scrapes every component on the private networks; alert rules are in alerts.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Every API and worker replica (Docker DNS returns one address per container).
  - job_name: api
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 9464
        refresh_interval: 15s
  - job_name: worker
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 9464
        refresh_interval: 15s

  - job_name: edge
    static_configs:
      - targets: ['edge:2019']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: containers
    static_configs:
      - targets: ['cadvisor:8080']

  # External checks of the public sites through the internet-facing path (TLS included).
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/probes.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
