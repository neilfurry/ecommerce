# Production settings for one PostgreSQL 17 server (tune shared_buffers/effective_cache_size
# to the VM: about 25% and 75% of its memory). See docs/production/DEPLOYMENT_GUIDE.md.
listen_addresses = '*'
max_connections = 200
shared_buffers = 1GB
effective_cache_size = 3GB
maintenance_work_mem = 256MB
work_mem = 16MB
wal_buffers = 16MB
random_page_cost = 1.1
effective_io_concurrency = 200
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# Continuous WAL archiving to the pgBackRest repository (point-in-time recovery). WAL is pushed
# once the stanza exists (the backup service creates it and leaves a marker in the data
# directory); before the first backup there is nothing to recover to, so WAL is not kept.
# Afterwards a failed push fails the command and PostgreSQL retries (WAL piles up and the
# PostgresWalArchiveFailing alert fires). pgBackRest requires the command to call it directly.
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/data/.pgbackrest-stanza || pgbackrest --stanza=main archive-push %p'
archive_timeout = 60
max_wal_senders = 5

# Observability: slow queries, lock waits and per-statement statistics.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
log_min_duration_statement = 500
log_lock_waits = on
log_checkpoints = on
log_autovacuum_min_duration = 1000
log_line_prefix = '%m [%p] %q%u@%d '
track_io_timing = on

timezone = 'UTC'
log_timezone = 'UTC'
password_encryption = scram-sha-256
ssl = off  # traffic stays on the private Docker network; enable with certificates if it leaves it
